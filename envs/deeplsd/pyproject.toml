[project]
name = "deeplsd-env"
version = "0.1.0"
description = "DeepLSD inference without optional Ceres line refinement"
requires-python = "==3.12.*"
dependencies = [
    "torch>=2.14",
    "torchvision",
    "numpy",
    "opencv-python",
    "scikit-image",
    "omegaconf",
    "kornia",
    "shapely",
    "matplotlib",
    "deeplsd",
    "pytlsd",
]

[tool.uv.sources]
deeplsd = { path = "../../deeplsd", editable = true }
pytlsd = { path = "../../deeplsd/third_party/pytlsd" }
