[project]
name = "linea-env"
version = "0.1.0"
description = "LINEA line detection in an isolated native environment"
requires-python = "==3.12.*"
dependencies = [
    "torch>=2.14",
    "torchvision",
    "numpy",
    "pillow",
    "opencv-python",
    "scipy",
    "addict",
    "yapf",
    "transformers",
    "pyyaml",
]
